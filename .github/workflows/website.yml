name: Website

# Deploys stiborsky.cz to Cloudflare after the website check passes. Setup and the API
# token's permissions: README.md.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - wrangler.jsonc
      - package.json
      - pnpm-lock.yaml
      - .htmlvalidate.json
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A running deploy is never cancelled; a waiting one is replaced by
# a newer push, so the latest commit always ends up deployed.
concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
